<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd2ff"/>
      <stop offset="0.55" stop-color="#2fb0d0"/>
      <stop offset="1" stop-color="#0d3a5a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fc0e0"/>
      <stop offset="1" stop-color="#0d3a5a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="392" cy="118" r="42" fill="#ffe9a8" opacity="0.9"/>
  <!-- sea -->
  <path d="M0 322 Q64 302 128 322 T256 322 T384 322 T512 322 L512 512 L0 512 Z" fill="url(#sea)"/>
  <!-- blocky boat hull, built out of cubes like the game -->
  <g>
    <rect x="140" y="248" width="58" height="58" rx="8" fill="#b3803f" stroke="#6d4c24" stroke-width="7"/>
    <rect x="198" y="248" width="58" height="58" rx="8" fill="#b3803f" stroke="#6d4c24" stroke-width="7"/>
    <rect x="256" y="248" width="58" height="58" rx="8" fill="#a8503c" stroke="#6d2f24" stroke-width="7"/>
    <rect x="314" y="248" width="58" height="58" rx="8" fill="#b3803f" stroke="#6d4c24" stroke-width="7"/>
    <!-- second row -->
    <rect x="198" y="190" width="58" height="58" rx="8" fill="#9aa6b4" stroke="#5c6672" stroke-width="7"/>
    <rect x="256" y="190" width="58" height="58" rx="8" fill="#ffc93c" stroke="#a97f14" stroke-width="7"/>
  </g>
  <!-- sail -->
  <rect x="246" y="86" width="14" height="112" rx="6" fill="#6d4c24"/>
  <path d="M260 92 L346 152 L260 186 Z" fill="#f2f4f8" stroke="#c3ccd8" stroke-width="6" stroke-linejoin="round"/>
  <!-- balloon -->
  <circle cx="160" cy="176" r="30" fill="#ff5d8f" stroke="#c03668" stroke-width="7"/>
  <path d="M160 206 L160 248" stroke="#c03668" stroke-width="7" stroke-linecap="round"/>
  <!-- treasure sparkle -->
  <path d="M430 372 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 Z" fill="#ffe9a8"/>
</svg>
