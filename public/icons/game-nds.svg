      <stop offset="0" stop-color="#5a6a7a"/><stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <linearGradient id="tor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0f0"/><stop offset="1" stop-color="#8fa4ba"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="34" fill="url(#sky)"/>
  <!-- water -->
