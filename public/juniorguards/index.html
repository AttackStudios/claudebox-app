<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junior Guards Simulator 🏖️</title>
<link rel="stylesheet" href="/juniorguards/css/jg.css">
<link rel="stylesheet" href="/css/cbx-style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
</head>
<body class="cbx-ui">
<canvas id="c"></canvas>

<!-- title screen (Feather-Friends style: floats over the live world) -->
<div id="title">
  <div id="title-word" class="cbx-loud">JUNIOR&nbsp;GUARDS</div>
  <div id="title-sub">Capitola&nbsp;·&nbsp;California&nbsp;·&nbsp;Simulator</div>
  <div id="title-name" class="cbx-chip"></div>
  <button id="title-play" class="cbx-btn primary" style="font-size:26px;padding:16px 52px;border-radius:999px;">▶ PLAY</button>
</div>

<!-- server manager -->
<div id="menu" class="hidden">
  <div class="panel cbx-panel cbx-pop">
    <h2>🏖️ Servers</h2>
    <div id="srv-list" class="cbx-scroll"></div>
    <div class="row gap">
      <button id="srv-refresh" class="cbx-btn ghost">↻ Refresh</button>
      <button id="srv-create" class="cbx-btn primary">＋ Create Server</button>
      <button id="srv-offline" class="cbx-btn ghost">🌙 Play Offline</button>
    </div>
  </div>
</div>

<!-- create server -->
<div id="create" class="hidden">
  <div class="panel cbx-panel cbx-pop">
    <h2>Create your server</h2>
    <input id="cr-name" class="cbx-input" maxlength="40" placeholder="Server name">
    <div class="row gap" id="cr-modes">
      <button class="mode on cbx-tile" data-mode="rp">🎭 RP</button>
      <button class="mode off cbx-tile" data-mode="normal" title="Coming soon">🏁 Normal (soon)</button>
    </div>
    <div class="row gap">
      <button id="cr-back" class="cbx-btn ghost">Back</button>
      <button id="cr-go" class="cbx-btn go">Create</button>
    </div>
  </div>
</div>

<!-- RP role pick -->
<div id="rolepick" class="hidden">
  <div class="panel cbx-panel cbx-pop">
    <h2>Choose your role</h2>
    <div class="row gap">
      <button id="role-instructor" class="rolebtn cbx-tile">🧑‍🏫 Instructor</button>
      <button id="role-student" class="rolebtn cbx-tile">🧒 Student</button>
    </div>
  </div>
</div>

<!-- backpack contents -->
<div id="packui" class="hidden">
  <div class="panel cbx-panel cbx-pop">
    <h2>🎒 Backpack</h2>
    <div id="pack-items" class="cbx-scroll"></div>
    <button id="pack-close" class="cbx-btn ghost">Close</button>
  </div>
</div>

<!-- stretches -->
<div id="stretchui" class="hidden">
  <div class="panel tall cbx-panel cbx-pop">
    <h2>🤸 Stretches</h2>
    <div id="stretch-list" class="cbx-scroll"></div>
    <button id="stretch-close" class="cbx-btn ghost">Close</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="host-bar" class="hidden">
    <button id="host-start" class="cbx-btn go">▶ Start Game</button>
    <button id="host-invite" class="cbx-btn">✉️ Invite friend</button>
  </div>
  <div id="weather-chip" class="hidden cbx-chip"></div>
  <div id="wet-chip" class="hidden cbx-chip glow">💧 Wet</div>
  <div id="stretch-chip" class="hidden cbx-slab cbx-loud"></div>
  <div id="actions">
    <button id="act-pack">🎒</button>
    <button id="act-stretch">🤸</button>
    <button id="act-leave">🚪</button>
  </div>
  <div id="ctx-actions"></div>
  <div id="clock" class="cbx-chip">🕐 7:30 AM</div>
  <div id="hints">WASD move · Shift run · Space jump · drag to look · scroll in = first person</div>
</div>
<div id="toasts"></div>

<script type="module" src="/juniorguards/js/main.js"></script>
</body>
</html>
