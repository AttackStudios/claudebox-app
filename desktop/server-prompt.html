<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom server</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fff; color: #1d2433; padding: 22px 24px 18px;
      -webkit-user-select: none; user-select: none;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 14px; font-size: 12.5px; color: #6b7382; line-height: 1.4; }
    input {
      width: 100%; padding: 9px 11px; font-size: 14px; border-radius: 8px; border: 1px solid #c9d0dc;
      outline: none; -webkit-user-select: text; user-select: text;
    }
    input:focus { border-color: #3b6cff; box-shadow: 0 0 0 3px rgba(59,108,255,.18); }
    .error { min-height: 18px; margin: 8px 0 0; font-size: 12px; color: #d33f56; }
    .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    button {
      padding: 8px 18px; border-radius: 8px; border: 1px solid #c9d0dc; background: #fff; color: #1d2433;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.primary { background: #3b6cff; border-color: #3b6cff; color: #fff; }
    button.primary:hover { background: #2f5be0; }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <h1>Connect to a custom ClaudeBox server</h1>
  <p>Enter the address of a self-hosted ClaudeBox, e.g. <b>http://192.168.1.20:8787</b>. Only the origin (scheme, host, port) is used.</p>
  <input id="url" type="url" spellcheck="false" autocomplete="off" placeholder="https://claudebox.example.com">
  <p class="error" id="error"></p>
  <div class="row">
    <button id="cancel" type="button">Cancel</button>
    <button id="connect" type="button" class="primary">Connect</button>
  </div>
  <script>
    (function () {
      var bridge = window.ClaudeBoxDesktopInternal;
      var q = new URLSearchParams(location.search);
      var input = document.getElementById('url');
      var error = document.getElementById('error');
      var connect = document.getElementById('connect');
      input.value = q.get('current') || (bridge && bridge.serverUrl) || '';
      input.focus();
      input.select();

      function cancel() { if (bridge) bridge.closePrompt(); else window.close(); }
      async function submit() {
        error.textContent = '';
        if (!bridge) { error.textContent = 'Desktop bridge unavailable.'; return; }
        connect.disabled = true;
        try {
          var res = await bridge.setServer(input.value);
          if (!res || !res.ok) error.textContent = (res && res.error) || 'Could not use that address.';
        } finally {
          connect.disabled = false;
        }
      }
      connect.addEventListener('click', submit);
      document.getElementById('cancel').addEventListener('click', cancel);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submit();
        if (e.key === 'Escape') cancel();
      });
    })();
  </script>
</body>
</html>
